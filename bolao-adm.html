        .form-group { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .form-group label { font-size: 13px; font-weight: 600; color: #475569; }
        input[type="text"], input[type="number"], input[type="password"], select {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: white;

        button { padding: 12px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }

        .grade-escudos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 220px; overflow-y: auto; margin-top: 8px; padding: 4px; border: 1px solid #e2e8f0; border-radius: 8px; }
        .card-escudo-selecionavel { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; background: #fff; transition: all 0.15s; }
        .card-escudo-selecionavel img { width: 32px; height: 32px; object-fit: contain; }
        .card-escudo-selecionavel span { font-size: 9px; text-align: center; line-height: 1.1; color: #475569; }
        .card-escudo-selecionavel.selecionado { border-color: #8b5cf6; background: #f5f3ff; }
        .card-escudo-selecionavel.selecionado span { color: #5b21b6; font-weight: 700; }
        .info-header-box { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-bottom: 12px; background: #fff; padding: 10px 15px; border-radius: 10px; border: 1px solid #e2e8f0; font-weight: bold; font-size: 14px; }

        .boneco-mascote {
            cursor: pointer;
            transform-origin: center bottom;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.18));
            animation: bonecoEntrada 0.8s ease-out, bonecoFloat 3.2s ease-in-out infinite 0.8s;
        }
        @keyframes bonecoEntrada {
            0% { opacity: 0; transform: scale(0.4) translateY(50px) rotate(-8deg); }
            60% { opacity: 1; transform: scale(1.1) translateY(-8px) rotate(3deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        }
        @keyframes bonecoFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        .boneco-mascote.boneco-pulo { animation: bonecoPulo 0.6s ease; }
        @keyframes bonecoPulo {
            0% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.25) rotate(-12deg) translateY(-14px); }
            60% { transform: scale(0.92) rotate(8deg) translateY(2px); }
            100% { transform: scale(1) rotate(0deg) translateY(0); }
        }
        .badge-status-jogo { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
        .badge-aberto { background: #dcfce7; color: #15803d; }

<body>

<script>
const TIMES = {
    brasileirao: ["Atlético-MG","Athletico-PR","Bahia","Botafogo","Bragantino","Chapecoense","Corinthians","Coritiba","Cruzeiro","Flamengo","Fluminense","Grêmio","Internacional","Mirassol","Palmeiras","Remo","Santos","São Paulo","Vasco da Gama","Vitória"],
    premier: ["Arsenal","Aston Villa","Bournemouth","Brentford","Brighton","Chelsea","Coventry City","Crystal Palace","Everton","Fulham","Hull City","Ipswich Town","Leeds United","Liverpool","Manchester City","Manchester United","Newcastle United","Nottingham Forest","Sunderland","Tottenham Hotspur"],
    laliga: ["FC Barcelona","Real Madrid","Villarreal","Atlético de Madrid","Real Betis","Celta de Vigo","Real Sociedad","Getafe","Athletic Club","Valencia","Sevilla","Rayo Vallecano","Osasuna","Espanyol","Alavés","Levante","Elche","Racing de Santander","Deportivo de La Coruña","Málaga"]
};

const ESCUDOS = {
    "Atlético-MG": "escudos/escudo_atletico-mg.png",
    "Athletico-PR": "escudos/escudo_athletico-pr.png",
    "Bahia": "escudos/escudo_bahia.png",
    "Botafogo": "escudos/escudo_botafogo.png",
    "Bragantino": "escudos/escudo_bragantino.png",
    "Chapecoense": "escudos/escudo_chapecoense.png",
    "Corinthians": "escudos/escudo_corinthians.png",
    "Coritiba": "escudos/escudo_coritiba.png",
    "Cruzeiro": "escudos/escudo_cruzeiro.png",
    "Flamengo": "escudos/escudo_flamengo.png",
    "Fluminense": "escudos/escudo_fluminense.png",
    "Grêmio": "escudos/escudo_gremio.png",
    "Internacional": "escudos/escudo_internacional.png",
    "Mirassol": "escudos/escudo_mirassol.png",
    "Palmeiras": "escudos/escudo_palmeiras.png",
    "Remo": "escudos/escudo_remo.png",
    "Santos": "escudos/escudo_santos.png",
    "São Paulo": "escudos/escudo_sao-paulo.png",
    "Vasco da Gama": "escudos/escudo_vasco-da-gama.png",
    "Vitória": "escudos/escudo_vitoria.png"
};

let eOrganizadorAutenticado = false;
let todosOsJogos = {};
let todosOsPalpites = [];
let historicoJogos = {};
let selecionadoTimeCasa = null;
let selecionadoTimeFora = null;

function animarBonecoAdminClique() {
    let el = document.getElementById('bonecoMascoteAdmin');
    if (!el) return;
    el.classList.remove('boneco-pulo');
    void el.offsetWidth;
    el.classList.add('boneco-pulo');
    el.addEventListener('animationend', function limpar(e) {
        if (e.animationName === 'bonecoPulo') {
            el.classList.remove('boneco-pulo');
            el.removeEventListener('animationend', limpar);
        }
    });
}

function liberarPainelAdmin() {
    if (document.getElementById('senhaAdmin').value === "jd123") {
        eOrganizadorAutenticado = true;
        document.getElementById('cardLoginAdmin').style.display = 'none';
        document.getElementById('painelAdminControle').style.display = 'flex';
        atualizarListasTimes();
        renderizarListaJogos();
        renderizarHistorico();
    } else alert("Senha incorreta!");
}

function atualizarListasTimes() {
    let campeonato = document.getElementById('selCampeonato').value;
    let selCasa = document.getElementById('selTimeCasa');
    let selFora = document.getElementById('selTimeFora');
    let livreCasa = document.getElementById('txtTimeCasaLivre');
    let livreFora = document.getElementById('txtTimeForaLivre');
    let gradeCasa = document.getElementById('gradeTimeCasa');
    let gradeFora = document.getElementById('gradeTimeFora');

    selecionadoTimeCasa = null;
    selecionadoTimeFora = null;

    if (campeonato === 'champions') {
        selCasa.style.display = 'none';
        selFora.style.display = 'none';
        gradeCasa.style.display = 'none';
        gradeFora.style.display = 'none';
        livreCasa.style.display = 'block';
        livreFora.style.display = 'block';
        return;
    }

    livreCasa.style.display = 'none';
    livreFora.style.display = 'none';

    if (campeonato === 'brasileirao') {
        // Times com escudo: mostra a grade de escudos clicáveis em vez do menu de texto
        selCasa.style.display = 'none';
        selFora.style.display = 'none';
        gradeCasa.style.display = 'grid';
        gradeFora.style.display = 'grid';

        let lista = TIMES.brasileirao;
        gradeCasa.innerHTML = lista.map(t => montarCardEscudo(t, 'casa')).join('');
        gradeFora.innerHTML = lista.map(t => montarCardEscudo(t, 'fora')).join('');
        return;
    }

    // Campeonatos sem escudo ainda: menu de texto normal
    gradeCasa.style.display = 'none';
    gradeFora.style.display = 'none';
    selCasa.style.display = 'block';
    selFora.style.display = 'block';

    let lista = TIMES[campeonato] || [];
    selCasa.innerHTML = lista.map(t => `<option value="${t}">${t}</option>`).join('');
    selFora.innerHTML = lista.map(t => `<option value="${t}">${t}</option>`).join('');
}

function montarCardEscudo(nome, lado) {
    let escudo = ESCUDOS[nome] || '';
    return `<div class="card-escudo-selecionavel" data-time="${nome}" data-lado="${lado}" onclick="selecionarTime('${nome.replace(/'/g, "\\'")}', '${lado}')">
        <img src="${escudo}" alt="${nome}">
        <span>${nome}</span>
    </div>`;
}

function selecionarTime(nome, lado) {
    if (lado === 'casa') selecionadoTimeCasa = nome;
    else selecionadoTimeFora = nome;

    let grade = document.getElementById(lado === 'casa' ? 'gradeTimeCasa' : 'gradeTimeFora');
    grade.querySelectorAll('.card-escudo-selecionavel').forEach(card => {
        card.classList.toggle('selecionado', card.dataset.time === nome);
    });
}

function iniciaisTime(nome) {
    if (!nome) return '?';
    let palavras = nome.replace(/[^\wÀ-ÿ\s]/g, '').split(' ').filter(p => p.length > 0);
    if (palavras.length === 1) return palavras[0].substring(0, 3).toUpperCase();
    return palavras.map(p => p[0]).join('').substring(0, 3).toUpperCase();
}

function corDoTime(nome) {
    let hash = 0;
    for (let i = 0; i < (nome || '').length; i++) hash = nome.charCodeAt(i) + ((hash << 5) - hash);
    let cores = ['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316'];
    return cores[Math.abs(hash) % cores.length];
}

db.ref('bolao/potJogo').on('value', snap => {
    document.getElementById('txtPoteAtual').innerText = "R$ " + (parseFloat(snap.val()) || 0).toFixed(2).replace('.', ',');
});

db.ref('bolao/fundoCampeonato').on('value', snap => {
    document.getElementById('txtFundoCampeonato').innerText = "R$ " + (parseFloat(snap.val()) || 0).toFixed(2).replace('.', ',');
});

db.ref('bolao/jogos').on('value', snap => {
    todosOsJogos = snap.val() || {};
    if (eOrganizadorAutenticado) renderizarListaJogos();
});

db.ref('bolao/palpites').on('value', snap => {
    todosOsPalpites = [];
    snap.forEach(c => { let v = c.val(); if (v) { v._chave = c.key; todosOsPalpites.push(v); } });
    if (eOrganizadorAutenticado) renderizarListaJogos();
});

db.ref('bolao/historicoJogos').on('value', snap => {
    historicoJogos = snap.val() || {};
    if (eOrganizadorAutenticado) renderizarHistorico();
});

function renderizarListaJogos() {
    let container = document.getElementById('listaJogosAdmin');
    let ids = Object.keys(todosOsJogos).sort((a, b) => b - a);
    document.getElementById('totalJogosCadastrados').innerText = ids.length;

    if (ids.length === 0) {
        container.innerHTML = `<p style="color:#94a3b8; font-size:13px; text-align:center;">Nenhum jogo cadastrado ainda.</p>`;
        return;
    }

    container.innerHTML = "";
    ids.forEach(id => {
        let jogo = todosOsJogos[id];
        let palpitesDoJogo = todosOsPalpites.filter(p => p.jogoId == id);
        let statusClasse = jogo.status === 'aberto' ? 'badge-aberto' : (jogo.status === 'encerrado' ? 'badge-encerrado' : 'badge-fechado');
        let statusTexto = jogo.status === 'aberto' ? 'ABERTO' : (jogo.status === 'encerrado' ? 'ENCERRADO' : 'FECHADO');

        let div = document.createElement('div');
        div.className = "jogo-linha-admin";
        let escudoCasa = ESCUDOS[jogo.timeCasa] ? `<img src="${ESCUDOS[jogo.timeCasa]}" style="width:20px; height:20px; object-fit:contain; vertical-align:middle;">` : '';
        let escudoFora = ESCUDOS[jogo.timeFora] ? `<img src="${ESCUDOS[jogo.timeFora]}" style="width:20px; height:20px; object-fit:contain; vertical-align:middle;">` : '';
        div.innerHTML = `
            <div class="topo-jogo">
                <div><strong>Jogo #${jogo.numeroJogo || '-'}: ${escudoCasa} ${jogo.timeCasa} x ${jogo.timeFora} ${escudoFora}</strong><br>
                <small>${jogo.dataHora || ''} — Palpite: R$ ${(parseFloat(jogo.precoPalpite)||0).toFixed(2).replace('.', ',')} — 🎯 ${palpitesDoJogo.length} palpites</small></div>
                <span class="badge-status-jogo ${statusClasse}">${statusTexto}</span>
            </div>
            <div class="acoes-jogo">
                <button class="btn-green" onclick="alterarStatusJogo('${id}', 'aberto')" ${jogo.status === 'encerrado' ? 'disabled' : ''}>🔓 Abrir</button>
                <button class="btn-red" onclick="alterarStatusJogo('${id}', 'fechado')" ${jogo.status === 'encerrado' ? 'disabled' : ''}>🔒 Fechar</button>
                <button class="btn-blue" onclick="togglePainel('placar-${id}')">🏁 Lançar Placar</button>
                <button class="btn-purple" onclick="togglePainel('palpites-${id}')">👁 Ver Palpites</button>
            </div>
            <div class="painel-placar-final" id="placar-${id}" style="display:none;">
                <input type="number" id="pCasa-${id}" placeholder="Placar ${jogo.timeCasa}" min="0">
                <input type="number" id="pFora-${id}" placeholder="Placar ${jogo.timeFora}" min="0">
                <button class="btn-purple" style="grid-column: span 2;" onclick="lancarPlacarFinal('${id}')">🏁 Confirmar Resultado e Apurar Vencedores</button>
            </div>
            <div class="painel-palpites-jogo lista-linhas-compacta" id="palpites-${id}" style="display:none;"></div>
        `;
        container.appendChild(div);

        let painelPalpites = div.querySelector(`#palpites-${id}`);
        if (palpitesDoJogo.length === 0) {
            painelPalpites.innerHTML = `<p style="color:#94a3b8; font-size:12px; text-align:center;">Nenhum palpite registrado ainda.</p>`;
        } else {
            palpitesDoJogo.forEach(p => {
                let linha = document.createElement('div');
                linha.className = "item-lista-admin";
                linha.innerHTML = `<div><strong>${p.nome}</strong><br><small>📞 ${p.telefone} — Palpite: ${p.placarCasa} x ${p.placarFora}</small></div>`;
                painelPalpites.appendChild(linha);
            });
        }
    });
}

function togglePainel(idElemento) {
    let el = document.getElementById(idElemento);
    if (!el) return;
    let estaEscondido = (el.style.display === 'none' || el.style.display === '');
    if (el.classList.contains('painel-palpites-jogo')) {
        el.style.display = estaEscondido ? 'block' : 'none';
    } else {
        el.style.display = estaEscondido ? 'grid' : 'none';
    }
}

function renderizarHistorico() {
    let container = document.getElementById('listaHistoricoJogos');
    container.innerHTML = "";
    let ids = Object.keys(historicoJogos).sort((a,b) => b - a);
    if (ids.length === 0) {
        container.innerHTML = `<p style="color:#94a3b8; font-size:13px; text-align:center;">Nenhum jogo encerrado ainda.</p>`;
        return;
    }
    ids.forEach(id => {
        let j = historicoJogos[id];
        let div = document.createElement('div');
        div.className = "item-lista-admin";
        div.style.flexDirection = "column";
        div.style.alignItems = "flex-start";
        let resultado = j.vencedores && j.vencedores.length > 0
            ? `🏆 ${j.vencedores.length} vencedor(es) — R$ ${(j.valorPorVencedor||0).toFixed(2).replace('.', ',')} cada`
            : `🔄 Ninguém acertou — pote acumulou`;
        div.innerHTML = `<div><strong>${j.timeCasa} ${j.placarCasaFinal} x ${j.placarForaFinal} ${j.timeFora}</strong></div>
            <div style="font-size:12px; color:#475569;">${resultado}</div>`;
        container.appendChild(div);
    });
}

function cadastrarNovoJogo() {
    let campeonato = document.getElementById('selCampeonato').value;
    let timeCasa, timeFora;
    if (campeonato === 'champions') {
        timeCasa = document.getElementById('txtTimeCasaLivre').value.trim();
        timeFora = document.getElementById('txtTimeForaLivre').value.trim();
    } else if (campeonato === 'brasileirao') {
        timeCasa = selecionadoTimeCasa;
        timeFora = selecionadoTimeFora;
    } else {
        timeCasa = document.getElementById('selTimeCasa').value;
        timeFora = document.getElementById('selTimeFora').value;
    }
    let dataHora = document.getElementById('inpDataHora').value.trim();
    let preco = parseFloat(document.getElementById('inpPrecoPalpite').value.replace(',', '.'));

    if (!timeCasa || !timeFora) return alert("Clique no escudo (ou selecione/digite) os dois times!");
    if (timeCasa === timeFora) return alert("Os times não podem ser iguais!");
    if (!dataHora) return alert("Informe a data/hora do jogo!");
    if (isNaN(preco) || preco <= 0) return alert("Informe um preço de palpite válido!");

    let novoId = Date.now();

    db.ref('bolao/proximoNumeroJogo').transaction(v => (parseInt(v) || 0) + 1).then(resultado => {
        let numeroJogo = resultado.snapshot.val();

        db.ref('bolao/jogos/' + novoId).set({
            id: novoId,
            numeroJogo: numeroJogo,
            campeonato: campeonato,
            timeCasa: timeCasa,
            timeFora: timeFora,
            dataHora: dataHora,
            precoPalpite: preco,
            status: 'fechado'
        }).then(() => {
            alert("✅ Jogo #" + numeroJogo + " cadastrado! Clique em 'Abrir' na lista de jogos quando quiser liberar apostas.");
            document.getElementById('inpDataHora').value = '';
            document.getElementById('inpPrecoPalpite').value = '';
            selecionadoTimeCasa = null;
            selecionadoTimeFora = null;
            atualizarListasTimes();
        });
    });
}

function alterarStatusJogo(jogoId, status) {
    db.ref('bolao/jogos/' + jogoId + '/status').set(status);
}

function lancarPlacarFinal(jogoId) {
    let jogo = todosOsJogos[jogoId];
    if (!jogo) return alert("Jogo não encontrado!");

    let pCasa = parseInt(document.getElementById('pCasa-' + jogoId).value);
    let pFora = parseInt(document.getElementById('pFora-' + jogoId).value);
    if (isNaN(pCasa) || isNaN(pFora)) return alert("Informe o placar final dos dois times!");

    if (!confirm(`Confirma o resultado final: ${jogo.timeCasa} ${pCasa} x ${pFora} ${jogo.timeFora}? Essa ação vai apurar os vencedores e não pode ser desfeita.`)) return;

    db.ref('bolao/potJogo').once('value').then(snapPote => {
        let poteAtual = parseFloat(snapPote.val()) || 0;

        let doJogo = todosOsPalpites.filter(p => p.jogoId == jogoId);
        let vencedores = doJogo.filter(p => parseInt(p.placarCasa) === pCasa && parseInt(p.placarFora) === pFora);

        let registroHistorico = {
            id: jogo.id,
            campeonato: jogo.campeonato,
            timeCasa: jogo.timeCasa,
            timeFora: jogo.timeFora,
            placarCasaFinal: pCasa,
            placarForaFinal: pFora,
            encerradoEm: Date.now()
        };

        if (vencedores.length > 0) {
            let valorPorVencedor = poteAtual / vencedores.length;
            registroHistorico.vencedores = vencedores.map(v => ({ nome: v.nome, telefone: v.telefone }));
            registroHistorico.valorPorVencedor = valorPorVencedor;

            let promessas = vencedores.map(v => {
                let tel = (v.telefone || '').replace(/\D/g, '');
                return db.ref('creditos/' + tel).once('value').then(snapSaldo => {
                    let saldoAtual = parseFloat(snapSaldo.val()) || 0;
                    return db.ref('creditos/' + tel).set(saldoAtual + valorPorVencedor);
                });
            });

            Promise.all(promessas).then(() => {
                db.ref('bolao/potJogo').set(0);
                db.ref('bolao/historicoJogos/' + jogo.id).set(registroHistorico);
                db.ref('bolao/jogos/' + jogoId + '/status').set('encerrado');
                alert(`🏆 ${vencedores.length} vencedor(es)! R$ ${valorPorVencedor.toFixed(2).replace('.', ',')} creditado(s) para cada um.`);
            });
        } else {
            registroHistorico.vencedores = [];
            db.ref('bolao/historicoJogos/' + jogo.id).set(registroHistorico);
            db.ref('bolao/jogos/' + jogoId + '/status').set('encerrado');
            alert("🔄 Ninguém acertou o placar exato. O pote continua acumulado para o próximo jogo!");
        }
    });
}
</script>
